name: Rudu Dev Build

# Unsigned Rudu-branded desktop builds (macOS DMG + Windows NSIS) published to
# the fork's Releases page under a rolling tag. Manual only:
#
#   Actions → Rudu Dev Build → Run workflow (from main)
#
# Colleagues then download from github.com/we-r-rudu/buzz/releases:
#   macOS:   open the DMG, drag to /Applications, then
#            xattr -dr com.apple.quarantine /Applications/Ruduzz.app
#   Windows: SmartScreen → More info → Run anyway
#
# Rudu identity (productName / bundle identifier / keychain service) is patched
# at build time only, so main stays pristine (FORK.md deploy-hunk rule).
# No signing, no updater artifacts — internal dev distribution, not a release lane.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rudu-release
  cancel-in-progress: false

env:
  PRODUCT_NAME: Ruduzz
  BUNDLE_ID: xyz.block.buzz.app.dev.rudu
  KEYCHAIN_SERVICE: buzz-desktop-rudu
  RELEASE_TAG: rudu-dev

jobs:
  macos:
    name: Build macOS DMG (arm64, unsigned)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # macos-latest is already aarch64; explicit target keeps bundle paths stable.
      - name: Add Rust target
        run: rustup target add "$TARGET"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            .
            desktop/src-tauri
          shared-key: rudu-release-macos

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Rudu identity
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");const p="desktop/src-tauri/tauri.conf.json";const c=JSON.parse(fs.readFileSync(p,"utf8"));c.productName=process.env.PRODUCT_NAME;c.identifier=process.env.BUNDLE_ID;fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n")'
          PB=/usr/libexec/PlistBuddy
          PLIST=desktop/src-tauri/Info.plist
          $PB -c "Set :CFBundleName $PRODUCT_NAME" "$PLIST"
          $PB -c "Set :CFBundleDisplayName $PRODUCT_NAME" "$PLIST"
          for key in NSMicrophoneUsageDescription NSCameraUsageDescription NSLocalNetworkUsageDescription; do
            cur=$($PB -c "Print :$key" "$PLIST")
            new=$(sed "s/^[^ ]* /$PRODUCT_NAME /" <<<"$cur")
            $PB -c "Set :$key $new" "$PLIST"
          done
          # Release arm of keyring_service() only — the bare 8-space-indented
          # literal, never the migration_marker_name comparison.
          sed -i.bak "s/^        \"buzz-desktop\"$/        \"$KEYCHAIN_SERVICE\"/" \
            desktop/src-tauri/src/app_state_keyring.rs
          rm desktop/src-tauri/src/app_state_keyring.rs.bak
          grep -n "\"$KEYCHAIN_SERVICE\"" desktop/src-tauri/src/app_state_keyring.rs

      - name: Generate non-updating bundle config
        shell: bash
        run: |
          cat > desktop/src-tauri/tauri.dev.conf.json <<'JSON'
          { "bundle": { "createUpdaterArtifacts": false } }
          JSON

      - name: Build sidecars
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Build macOS DMG (unsigned)
        run: cd desktop && pnpm tauri build --target "$TARGET" --bundles dmg --config src-tauri/tauri.dev.conf.json
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rudu-macos
          path: desktop/src-tauri/target/${{ env.TARGET }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows NSIS (x86_64, unsigned)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Add Rust target
        shell: bash
        run: rustup target add "$TARGET"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            .
            desktop/src-tauri
          shared-key: rudu-release-windows

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Install desktop dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Apply Rudu identity
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");const p="desktop/src-tauri/tauri.conf.json";const c=JSON.parse(fs.readFileSync(p,"utf8"));c.productName=process.env.PRODUCT_NAME;c.identifier=process.env.BUNDLE_ID;fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n")'
          # Windows has no PlistBuddy and does not use Info.plist — tauri.conf.json
          # + keychain service are the only identity surfaces here.
          sed -i.bak "s/^        \"buzz-desktop\"$/        \"$KEYCHAIN_SERVICE\"/" \
            desktop/src-tauri/src/app_state_keyring.rs
          rm desktop/src-tauri/src/app_state_keyring.rs.bak
          grep -n "\"$KEYCHAIN_SERVICE\"" desktop/src-tauri/src/app_state_keyring.rs

      - name: Generate non-updating bundle config
        shell: bash
        run: |
          cat > desktop/src-tauri/tauri.dev.conf.json <<'JSON'
          { "bundle": { "createUpdaterArtifacts": false } }
          JSON

      - name: Build sidecars
        shell: bash
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Build Windows NSIS installer (unsigned)
        shell: bash
        run: cd desktop && pnpm tauri build --target "$TARGET" --bundles nsis --config src-tauri/tauri.dev.conf.json
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rudu-windows
          path: desktop/src-tauri/target/${{ env.TARGET }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish rolling release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: rudu-*
          merge-multiple: true

      - name: List assets
        run: ls -lh dist/

      - name: Update rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --repo "$REPO" -y --cleanup-tag || true
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$REPO" \
            --target "$SHA" \
            --prerelease --latest=false \
            --title "Ruduzz dev build ($(date +%Y-%m-%d))" \
            --notes "Unsigned dev build from \`main\` (\`${SHA}\`). Rebuilt on demand via Actions → Rudu Dev Build.

          **macOS** (\`aarch64.dmg\`): open, drag to /Applications, then run
          \`xattr -dr com.apple.quarantine /Applications/Ruduzz.app\` (unsigned build).

          **Windows** (\`-setup.exe\`): SmartScreen → More info → Run anyway.

          Join your community, then ask an admin to add your pubkey to the relay allowlist."
